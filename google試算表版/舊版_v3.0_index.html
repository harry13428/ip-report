<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F4E79">
<title>IP 週報</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4E79'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EIP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F6F9;--card:#FFFFFF;--ink:#1B1F27;--muted:#6B7280;--line:#E3E7EE;
  --accent:#1F4E79;--accent-ink:#FFFFFF;--soft:#E8F0F8;
  --ok:#16A34A;--wait:#D97706;--stuck:#DC2626;--done:#2563EB;--warn-bg:#FEF2F2;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0F141B;--card:#171E28;--ink:#E7EBF0;--muted:#98A2B3;--line:#2A3441;--soft:#1E2B3A;--warn-bg:#3A1D1D;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
textarea{width:100%;min-height:64px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.5}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.app{max-width:760px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 6px}
.topbar{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px}
.brand small{font-weight:600;color:var(--accent);font-size:13px;margin-left:8px;background:var(--soft);padding:2px 9px;border-radius:999px}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#9CA3AF;display:inline-block}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--wait);animation:pulse 1s infinite}.dot.err{background:var(--stuck)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;flex:none}
.datebar{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--card);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.datebar button{height:38px;border-radius:9px;background:var(--soft);font-weight:700;color:var(--accent)}
.datebar .nav{width:40px;font-size:18px}
.datebar .pick{flex:1;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.datebar .pick small{font-weight:500;color:var(--muted);font-size:12px}
.guide{margin:10px 0 4px;padding:9px 12px;border-radius:10px;background:var(--soft);color:var(--accent);font-size:13px;line-height:1.5}
.guide b{font-weight:800}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;padding:8px 4px;border-radius:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ic{font-size:20px}
.tabs button.on{color:var(--accent);background:var(--soft);font-weight:700}
.page{display:none}.page.on{display:block}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:16px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--soft);color:var(--accent);font-weight:700;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--warn-bg);color:var(--stuck)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{margin:12px 0 0}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.field label small{font-weight:500;color:var(--muted);margin-left:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.status-seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:10px}
.status-seg button.on.ok{background:var(--ok);border-color:var(--ok)}
.status-seg button.on.wait{background:var(--wait);border-color:var(--wait)}
.status-seg button.on.stuck{background:var(--stuck);border-color:var(--stuck)}
.status-seg button.on.done{background:var(--done);border-color:var(--done)}
.ipcard .head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.ipcard .head .name{font-weight:800;font-size:17px;flex:1}
.ipcard .head .state{font-size:12px;color:var(--muted)}
.ipcard .body{display:none;margin-top:6px}
.ipcard.open .body{display:block}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent)}
.badge.dirty{background:#FEF3C7;color:#92400E}
.badge.ok{background:#DCFCE7;color:#166534}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600}
.pill button{color:var(--muted);font-size:14px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.openrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:10px;margin-top:8px}
.openrow .rm{justify-self:end}
.sdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;background:#9CA3AF}
.sdot.ok{background:var(--ok)}.sdot.wait{background:var(--wait)}.sdot.stuck{background:var(--stuck)}.sdot.done{background:var(--done)}
.person h3{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.person h3 .meta{font-weight:500;color:var(--muted);font-size:12px;margin-left:auto}
.iprow{border-top:1px solid var(--line)}
.iprow:first-of-type{border-top:0}
.iprow .t{display:flex;align-items:center;gap:8px;font-weight:700;padding:11px 0;cursor:pointer;user-select:none}
.iprow .t .film{font-weight:500;color:var(--muted);font-size:13px}
.iprow .t .st{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;white-space:nowrap}
.iprow .t .arrow{color:var(--muted);font-size:12px}
.iprow .d{display:none;padding:0 0 10px}
.iprow.open .d{display:block}
.kv{margin:4px 0 0 20px;font-size:14px;color:var(--ink)}
.kv b{color:var(--muted);font-weight:600;margin-right:4px}
.kv.help{color:var(--stuck)}
.kv.help b{color:var(--stuck)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.filters button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
.check input{margin-top:3px}
.divider{height:1px;background:var(--line);margin:12px 0}
a{color:var(--accent)}
.ver{color:var(--muted);font-size:11px;text-align:center;margin-top:20px}

/* 誰在用（登入畫面） */
.who{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.who .box{max-width:480px;margin:6vh auto 0}
.who h1{font-size:26px;margin:0 0 4px}
.who p{color:var(--muted);margin:0 0 18px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.names button{padding:16px 10px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:18px}
.names button:active{background:var(--soft)}
.who .or{color:var(--muted);font-size:13px;margin:8px 0}

/* ☰ 側邊選單 */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,320px);background:var(--card);z-index:45;transform:translateX(-105%);transition:transform .2s;padding:18px 14px;overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.2)}
.drawer.on{transform:none}.drawer-bg.on{display:block}
.drawer h2{margin:0 0 4px;font-size:18px}
.drawer .me{color:var(--muted);font-size:13px;margin-bottom:14px}
.drawer .item{display:flex;align-items:center;gap:10px;width:100%;padding:13px 10px;border-radius:10px;font-weight:600;text-align:left;text-decoration:none;color:var(--ink)}
.drawer .item:hover{background:var(--soft)}
.drawer .item .ic{width:24px;text-align:center}
.drawer .sec{color:var(--muted);font-size:12px;margin:14px 10px 4px}

/* 日曆 */
.cal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.cal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);background:var(--card);border-radius:16px;padding:14px;z-index:45;display:none;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.cal.on,.cal-bg.on{display:block}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .mh b{font-size:17px}
.cal .mh button{width:36px;height:36px;border-radius:9px;background:var(--soft);color:var(--accent);font-weight:800;font-size:18px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal .day{position:relative;aspect-ratio:1;border-radius:10px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.cal .day.other{color:var(--line)}
.cal .day.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .day.sel{background:var(--accent);color:#fff}
.cal .day .m{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal .day .m i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.cal .day.sel .m i{background:#fff}
.cal .foot{display:flex;gap:8px;margin-top:10px}
</style>
</head>
<body>

<!-- 誰在用 -->
<div class="who" id="who" style="display:none">
  <div class="box">
    <h1>IP 週報</h1>
    <p>你是誰？點一下自己的名字就進去。</p>
    <div class="names" id="nameList"></div>
    <div class="or">名單裡沒有你：</div>
    <div class="row"><input type="text" id="whoName" placeholder="打你的名字" style="flex:1;min-width:140px"><button class="btn primary" id="whoGo">進去</button></div>
  </div>
</div>

<!-- ☰ 選單 -->
<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer">
  <h2>IP 週報</h2>
  <div class="me">現在是：<b id="drawerMe"></b></div>
  <button class="item" id="mSwitch"><span class="ic">👤</span>換人（回到選名字）</button>
  <div class="sec">主管用</div>
  <a class="item" id="mSheet" href="#" target="_blank" rel="noopener"><span class="ic">📊</span>打開 Google 試算表（原始資料）</a>
  <button class="item" id="mCopyAll"><span class="ic">📋</span>複製這天全部人的回報文字</button>
  <div class="sec">其他</div>
  <button class="item" id="mExport"><span class="ic">💾</span>下載我的本機備份</button>
  <button class="item" id="mRefresh"><span class="ic">⟳</span>重新下載大家的回報</button>
  <div class="ver">IP 週報 <span id="ver"></span></div>
</nav>

<!-- 日曆 -->
<div class="cal-bg" id="calBg"></div>
<div class="cal" id="cal">
  <div class="mh"><button id="calPrev">‹</button><b id="calTitle"></b><button id="calNext">›</button></div>
  <div class="grid" id="calGrid"></div>
  <div class="foot"><button class="btn" id="calToday" style="flex:1">今天</button><button class="btn primary" id="calClose" style="flex:1">關閉</button></div>
  <div class="hint" style="font-size:12px;color:var(--muted);margin-top:8px">日期下面有點＝那天有人填過回報。</div>
</div>

<div class="app">
  <header>
    <div class="topbar">
      <button class="iconbtn" id="btnMenu" title="選單">☰</button>
      <div class="brand">IP 週報<small id="whoami"></small></div>
      <div class="spacer"></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">尚未連線</span></div>
    </div>
    <div class="datebar">
      <button class="nav" id="dayPrev" title="前一天">‹</button>
      <button class="pick" id="dayPick" title="打開日曆"><span>📅</span><span id="dayLabel"></span><small id="daySub"></small></button>
      <button class="nav" id="dayNext" title="後一天">›</button>
    </div>
    <div class="guide" id="guide"></div>
  </header>

  <!-- ===== 我的回報 ===== -->
  <section class="page" id="page-mine">
    <div id="mineSetupHint"></div>
    <div class="card">
      <h3>我負責的 IP</h3>
      <div class="sub">點 IP 名字展開填寫。沒有的 IP 按「＋新增」。</div>
      <div class="chips" id="ipChips"></div>
      <div class="row" style="margin-top:10px">
        <input type="text" id="newIpName" placeholder="IP 名字（例：樂樂）" style="flex:1;min-width:140px">
        <button class="btn" id="btnAddIp">＋ 新增 IP</button>
      </div>
    </div>
    <div id="ipCards"></div>
    <div class="card">
      <h3>交報告前自檢</h3>
      <label class="check"><input type="checkbox"> 每支沒過的片都有寫「卡在哪」，不是只寫「還沒過」</label>
      <label class="check"><input type="checkbox"> 每個卡點都有寫「我已經做了什麼」（追過、講過、提醒過）</label>
      <label class="check"><input type="checkbox"> IP 的新要求有寫進去，主管不用再翻群組</label>
      <label class="check"><input type="checkbox"> 需要主管幫忙的事有單獨寫，不是埋在段落裡</label>
      <label class="check"><input type="checkbox"> 開頭調整的片有寫「為什麼」</label>
      <div class="divider"></div>
      <button class="btn block" id="btnCopyMine">📋 複製我這天的回報文字（貼群組）</button>
    </div>
  </section>

  <!-- ===== 全部人 ===== -->
  <section class="page" id="page-all">
    <div class="filters">
      <button class="on" data-f="all">全部</button>
      <button data-f="stuck">🔴 卡住</button>
      <button data-f="help">需要主管協助</button>
      <button data-f="wait">🟡 等回覆</button>
    </div>
    <div id="allList"></div>
  </section>
</div>

<nav class="tabs">
  <button class="on" data-page="mine"><span class="ic">✍️</span>我的回報</button>
  <button data-page="all"><span class="ic">👥</span>全部人</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ================= 設定 ================= */
const APP_VER = 'v3.0';
const API_URL = 'https://script.google.com/macros/s/AKfycbycx6jdZdggGz4iVkDJ5ZkjoyT5n-7X2Vt0hbn86iwU1KgaFrb3RvZoS_XWhcDy3aN4/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1rpuVje8QJrwARumPDnT6S7eyKlNMSe6Y14JBXWfY3us/edit';
const API = new URLSearchParams(location.search).get('api') || API_URL;
const LS = { cfg: 'ipreport_cfg_v3', draft: 'ipreport_draft_v3', cache: 'ipreport_cache_v3' };
const STATUS = {
  ok:   { label:'🟢 順利',  cls:'ok'   },
  wait: { label:'🟡 等回覆', cls:'wait' },
  stuck:{ label:'🔴 卡住',  cls:'stuck'},
  done: { label:'✅ 已過片', cls:'done' },
};
const PASS_OPTS = ['無', '要催 IP 過片', '交給小野', '已跟小野講'];
const ASSET_OPTS = ['無', '第1步 已跟 IP 要', '第2步 已跟小野說', '第3步 群組提醒過', '第4步 再跟小野說', '第5步 找主管／操盤'];
const WD = ['日','一','二','三','四','五','六'];

/* ================= 小工具 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const nowStr = () => { const d=new Date(); return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function loadJSON(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function fmtTime(iso){ const d=new Date(iso); if(isNaN(d)) return ''; return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function shiftDay(key, n){ const x=parseYmd(key); x.setDate(x.getDate()+n); return ymd(x); }
function dayLabel(key){ const d=parseYmd(key); const t=ymd(new Date());
  const tag = key===t ? '今天' : key===shiftDay(t,-1) ? '昨天' : key===shiftDay(t,1) ? '明天' : '';
  return { main:`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`, sub: tag }; }

/* ================= 狀態 ================= */
let cfg = loadJSON(LS.cfg, { name:'' });
let day = ymd(new Date());
let mine = loadJSON(LS.draft, null);        // 我的檔（含草稿）：{name, ips, weeks:{day:{ip:entry}}}
let everyone = loadJSON(LS.cache, {});      // name -> {name, ips, weeks:{day:{ip:entry}}}（全部日期）
let filter = 'all';
let openIp = null; let openAll = {};
let calMonth = null;

function blankEntry(){ return { film:'', status:'', pending:'', chase:'', news:'', pass:'無', assets:'無', assetsNote:'', help:'', opening:[], updatedAt:'' }; }
function ensureMine(){ if(!mine) mine = { name: cfg.name, ips:[], weeks:{} }; if(cfg.name) mine.name = cfg.name; mine.weeks ||= {}; mine.ips ||= []; return mine; }
function entry(ip){ ensureMine(); mine.weeks[day] ||= {}; mine.weeks[day][ip] ||= blankEntry(); return mine.weeks[day][ip]; }
function stripMeta(o){ if(!o) return null; const c=JSON.parse(JSON.stringify(o)); delete c.updatedAt; return c; }
function persistDraft(){ saveJSON(LS.draft, mine); }
const remoteMine = () => (cfg.name && everyone[cfg.name]) || null;

/* ================= Google 試算表 API ================= */
/* Google 的回應偶爾會變成一頁 HTML（不是 JSON），遇到就自動重試 */
async function fetchJSON(url, opt, tries=3){
  let last='';
  for(let i=0;i<tries;i++){
    try{ const r = await fetch(url, opt); const t = await r.text(); if(t.trim().startsWith('{')){ const j = JSON.parse(t); if(!j.ok) throw new Error(j.error||'伺服器錯誤'); return j; } last='Google 暫時沒回應'; }
    catch(e){ if(e.message && !/Google/.test(e.message) && !/JSON|fetch|network/i.test(e.message)) throw e; last=e.message||'連線失敗'; }
    await new Promise(r=>setTimeout(r, 600*(i+1)));
  }
  throw new Error(last);
}
async function apiGet(params){ const u = API + '?' + new URLSearchParams({ ...params, _: Date.now() }); return fetchJSON(u, { method:'GET', redirect:'follow', cache:'no-store' }); }
async function apiPost(body){ return fetchJSON(API, { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); }
function setSync(state, text){ const d=$('#syncDot'); d.className='dot '+(state||''); $('#syncText').textContent=text; }

async function refreshAll(silent){
  setSync('busy', '下載中…');
  try{
    const j = await apiGet({ action:'all' });          // 一次抓全部日期（資料很小）
    everyone = j.editors || {}; saveJSON(LS.cache, everyone);
    if(cfg.name && everyone[cfg.name]){
      const r = everyone[cfg.name]; ensureMine();
      mine.ips = [...new Set([...(r.ips||[]), ...mine.ips])];
      for(const dk of Object.keys(r.weeks||{})){ mine.weeks[dk] ||= {}; for(const ip of Object.keys(r.weeks[dk])){ const L = mine.weeks[dk][ip]; const R = r.weeks[dk][ip]; if(!L || (R.updatedAt||'') >= (L.updatedAt||'')) mine.weeks[dk][ip] = JSON.parse(JSON.stringify(R)); } }
      persistDraft();
    }
    setSync('ok', '已同步 ' + nowStr());
    if(!silent) toast('已更新大家的回報');
  }catch(e){ setSync('err', '同步失敗'); if(!silent) toast('下載失敗：' + e.message); }
  renderAll(); renderMine(); renderWho();
}

async function uploadIp(ip){
  if(!cfg.name){ showWho(); return; }
  setSync('busy', '上傳中…');
  try{
    const e = entry(ip); e.updatedAt = new Date().toISOString(); persistDraft();
    const j = await apiPost({ action:'save', editor:cfg.name, week:day, ip, entry:e, ips:mine.ips });
    if(j.skipped){ toast('伺服器上有更新的版本，先重新整理再改'); await refreshAll(true); return; }
    e.updatedAt = j.updatedAt || e.updatedAt; persistDraft();
    everyone[cfg.name] ||= { name:cfg.name, ips:[], weeks:{} }; const R = everyone[cfg.name]; R.ips = [...mine.ips]; R.weeks ||= {}; R.weeks[day] ||= {}; R.weeks[day][ip] = JSON.parse(JSON.stringify(e)); saveJSON(LS.cache, everyone);
    setSync('ok', '已上傳 ' + nowStr()); toast('已上傳，大家都看得到了');
  }catch(e){ setSync('err', '上傳失敗'); toast('上傳失敗：' + e.message); }
  renderMine(); renderAll();
}
async function uploadIps(){ if(!cfg.name) return; try{ await apiPost({ action:'ips', editor:cfg.name, ips:mine.ips }); everyone[cfg.name] ||= { name:cfg.name, ips:[], weeks:{} }; everyone[cfg.name].ips=[...mine.ips]; }catch(e){ toast('IP 清單沒同步成功：'+e.message); } }

/* ================= 誰在用 ================= */
function showWho(){ $('#who').style.display=''; renderWho(); }
function hideWho(){ $('#who').style.display='none'; }
function renderWho(){ const names = Object.keys(everyone).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  $('#nameList').innerHTML = names.length ? names.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join('') : '<div class="empty" style="grid-column:1/-1">還沒有人用過，在下面打名字。</div>';
  $('#nameList').querySelectorAll('button').forEach(b => b.onclick = () => becomeUser(b.dataset.n)); }
function becomeUser(name){ name=(name||'').trim(); if(!name) return toast('先打名字');
  if(mine && mine.name && mine.name !== name){ mine = null; try{ localStorage.removeItem(LS.draft); }catch(e){} }
  cfg = { name }; saveJSON(LS.cfg, cfg); ensureMine(); persistDraft(); hideWho(); renderHeader(); refreshAll(true); showPage('mine'); toast(`嗨 ${name}，開始填吧`); }

/* ================= 畫面：共用 ================= */
function showPage(p){ $$('.page').forEach(x=>x.classList.toggle('on', x.id==='page-'+p)); $$('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.page===p));
  $('#guide').innerHTML = { mine:'<b>怎麼用：</b>上面選日期 → 點 IP 展開 → 填片名、卡在哪 → 最後選狀態 → 按「儲存並上傳」。',
                            all:'<b>這頁：</b>大家這天的回報。點人底下的 IP 可以展開看那支片的狀況，紅字＝需要主管協助。' }[p]; window.scrollTo(0,0); }
function renderDay(){ const w=dayLabel(day); $('#dayLabel').textContent=w.main; $('#daySub').textContent=w.sub; }
function renderHeader(){ $('#whoami').textContent = cfg.name || ''; $('#drawerMe').textContent = cfg.name || '（還沒選）'; }

/* ================= 畫面：我的回報 ================= */
function renderMine(){
  ensureMine();
  $('#mineSetupHint').innerHTML = !cfg.name ? `<div class="card" style="border:2px solid var(--accent)"><h3>還沒選名字</h3><button class="btn primary" onclick="showWho()">選我是誰</button></div>` : '';
  const chips = $('#ipChips');
  chips.innerHTML = mine.ips.length ? mine.ips.map(ip => `<span class="pill">${esc(ip)} <button title="移除這個 IP" data-rm="${esc(ip)}">✕</button></span>`).join('') : '<span class="empty" style="padding:6px">還沒有 IP，先在下面新增。</span>';
  chips.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const ip=b.dataset.rm; if(confirm(`移除「${ip}」？（已填過的回報會保留，只是不再顯示）`)){ mine.ips = mine.ips.filter(x=>x!==ip); persistDraft(); uploadIps(); renderMine(); } });

  const wrap = $('#ipCards'); wrap.innerHTML = '';
  const R = remoteMine();
  mine.ips.forEach(ip => {
    const e = entry(ip); const st = STATUS[e.status];
    const remote = R?.weeks?.[day]?.[ip] || null;
    const dirtyIp = JSON.stringify(stripMeta(e)) !== JSON.stringify(stripMeta(remote || blankEntry()));
    const card = document.createElement('div'); card.className = 'card ipcard' + (openIp===ip?' open':'');
    card.innerHTML = `
      <div class="head"><span class="sdot ${st?st.cls:''}"></span><span class="name">${esc(ip)}${e.film?`<small style="font-weight:500;color:var(--muted);margin-left:6px">${esc(e.film)}</small>`:''}</span>
        ${dirtyIp?'<span class="badge dirty">未上傳</span>':(remote?'<span class="badge ok">已上傳</span>':'')}<span class="state">${openIp===ip?'收合 ▴':'展開 ▾'}</span></div>
      <div class="body">
        <div class="field"><label>這天的影片<small>片名＋版本</small></label><input type="text" data-f="film" placeholder="例：第 3 集 v2" value="${esc(e.film||'')}"></div>
        <div class="field"><label>1. 卡在哪<small>沒過的原因、卡在哪一步</small></label><textarea data-f="pending" placeholder="例：給 IP 看了 3 天沒回">${esc(e.pending)}</textarea></div>
        <div class="field"><label>2. 追過沒／對方回覆</label><textarea data-f="chase" placeholder="例：週三群組提醒一次，已跟小野講">${esc(e.chase)}</textarea></div>
        <div class="field"><label>3. IP 新動態<small>不喜歡什麼、想換什麼、喜歡的風格</small></label><textarea data-f="news" placeholder="例：最近在調美感，不要太跳">${esc(e.news)}</textarea></div>
        <div class="field"><label>4. 過片處理</label><div class="seg">${PASS_OPTS.map(o=>`<button class="${e.pass===o?'on':''}" data-f="pass" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>
        <div class="field"><label>5. 缺素材<small>追到第幾步</small></label><div class="seg">${ASSET_OPTS.map(o=>`<button class="${e.assets===o?'on':''}" data-f="assets" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
          <textarea data-f="assetsNote" style="margin-top:8px;min-height:44px" placeholder="缺什麼素材（沒缺可留白）">${esc(e.assetsNote)}</textarea></div>
        <div class="field"><label>6. 需要主管協助<small>會用紅色顯示給主管</small></label><textarea data-f="help" placeholder="自己處理不了、需要主管出面的事（沒有可留白）">${esc(e.help)}</textarea></div>
        <div class="field"><label>7. 本週開頭調整<small>片名／改了什麼／為什麼</small></label>
          <div>${(e.opening||[]).map((o,i)=>openingRow(o,i)).join('')}</div>
          <button class="btn small" data-addop="1" style="margin-top:8px">＋ 加一支</button></div>
        <div class="field"><label>這支 IP 這天的狀態<small>最後選</small></label>
          <div class="seg status-seg">${Object.entries(STATUS).map(([k,v])=>`<button class="${e.status===k?'on '+v.cls:''}" data-f="status" data-v="${k}">${v.label}</button>`).join('')}</div></div>
        <div class="divider"></div>
        <div class="row">
          <button class="btn primary" data-save="1" style="flex:1">💾 儲存並上傳</button>
          <button class="btn" data-revert="1" ${dirtyIp?'':'disabled'}>↩ 還原成上次上傳</button>
        </div>
        <div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px">${remote?.updatedAt?('上次上傳：'+fmtTime(remote.updatedAt)):'這天還沒上傳過'}</div>
      </div>`;
    card.querySelector('.head').onclick = () => { openIp = (openIp===ip?null:ip); renderMine(); };
    card.querySelectorAll('[data-f]').forEach(el => {
      if(el.tagName==='TEXTAREA' || el.tagName==='INPUT'){ el.oninput = () => { entry(ip)[el.dataset.f] = el.value; persistDraft(); markDirty(card); }; }
      else el.onclick = () => { entry(ip)[el.dataset.f] = el.dataset.v; persistDraft(); renderMine(); };
    });
    card.querySelector('[data-addop]').onclick = () => { entry(ip).opening.push({film:'',change:'',why:''}); persistDraft(); renderMine(); };
    card.querySelectorAll('[data-op]').forEach(el => { const i=+el.dataset.op; if(el.dataset.rmop!==undefined){ el.onclick=()=>{ entry(ip).opening.splice(i,1); persistDraft(); renderMine(); }; } else { el.oninput=()=>{ entry(ip).opening[i][el.dataset.k]=el.value; persistDraft(); markDirty(card); }; } });
    card.querySelector('[data-save]').onclick = () => uploadIp(ip);
    card.querySelector('[data-revert]').onclick = () => { if(!confirm('把這個 IP 這天的內容還原成上次上傳的版本？')) return; mine.weeks[day][ip] = remote ? JSON.parse(JSON.stringify(remote)) : blankEntry(); persistDraft(); renderMine(); };
    wrap.appendChild(card);
  });
}
function openingRow(o,i){ return `<div class="openrow"><input type="text" data-op="${i}" data-k="film" placeholder="片名" value="${esc(o.film)}"><input type="text" data-op="${i}" data-k="change" placeholder="開頭改了什麼／勾子是什麼" value="${esc(o.change)}"><input type="text" data-op="${i}" data-k="why" placeholder="為什麼這樣剪" value="${esc(o.why)}"><button class="btn small rm" data-op="${i}" data-rmop="1">移除</button></div>`; }
function markDirty(card){ const b=card.querySelector('.head .badge'); if(b){ b.className='badge dirty'; b.textContent='未上傳'; } else { const s=document.createElement('span'); s.className='badge dirty'; s.textContent='未上傳'; card.querySelector('.head .name').after(s); } const rv=card.querySelector('[data-revert]'); if(rv) rv.disabled=false; }

/* ================= 畫面：全部人 ================= */
function entryText(ip, e){
  const L=[]; L.push(`${STATUS[e.status]?.label || '⚪ 未填狀態'}　${ip}${e.film?('｜'+e.film):''}`);
  if(e.pending) L.push(`　卡在哪：${e.pending}`);
  if(e.chase) L.push(`　追過沒／回覆：${e.chase}`);
  if(e.news) L.push(`　IP 新動態：${e.news}`);
  if(e.pass && e.pass!=='無') L.push(`　過片處理：${e.pass}`);
  if(e.assets && e.assets!=='無') L.push(`　缺素材：${e.assets}${e.assetsNote?('（'+e.assetsNote+'）'):''}`); else if(e.assetsNote) L.push(`　缺素材：${e.assetsNote}`);
  if(e.help) L.push(`　⚠️ 需要主管協助：${e.help}`);
  (e.opening||[]).filter(o=>o.film||o.change||o.why).forEach(o=>L.push(`　開頭調整：${o.film}｜${o.change}｜${o.why}`));
  return L.join('\n');
}
function personText(name, file){ const wk=file?.weeks?.[day]||{}; const ips=Object.keys(wk);
  if(!ips.length) return `【${name}】這天沒填`; return `【${name}】\n` + ips.map(ip=>entryText(ip, wk[ip])).join('\n'); }
function entryDetail(e){ const has = e.pending||e.chase||e.news||(e.pass&&e.pass!=='無')||(e.assets&&e.assets!=='無')||e.assetsNote||e.help||(e.opening||[]).filter(o=>o.film||o.change||o.why).length; return `
  ${e.pending?`<div class="kv"><b>卡在哪</b>${esc(e.pending)}</div>`:''}
  ${e.chase?`<div class="kv"><b>追過沒</b>${esc(e.chase)}</div>`:''}
  ${e.news?`<div class="kv"><b>IP 新動態</b>${esc(e.news)}</div>`:''}
  ${(e.pass&&e.pass!=='無')?`<div class="kv"><b>過片處理</b>${esc(e.pass)}</div>`:''}
  ${(e.assets&&e.assets!=='無')||e.assetsNote?`<div class="kv"><b>缺素材</b>${esc(e.assets!=='無'?e.assets:'')} ${esc(e.assetsNote)}</div>`:''}
  ${e.help?`<div class="kv help"><b>⚠️ 需要主管協助</b>${esc(e.help)}</div>`:''}
  ${(e.opening||[]).filter(o=>o.film||o.change||o.why).map(o=>`<div class="kv"><b>開頭調整</b>${esc(o.film)}｜${esc(o.change)}｜${esc(o.why)}</div>`).join('')}
  ${!has?'<div class="kv" style="color:var(--muted)">只填了狀態</div>':''}
  ${e.updatedAt?`<div class="kv" style="color:var(--muted);font-size:12px">上傳 ${fmtTime(e.updatedAt)}</div>`:''}`; }
function renderAll(){
  const list = $('#allList');
  const names = Object.keys(everyone).sort((a,b)=> a===cfg.name?-1 : b===cfg.name?1 : a.localeCompare(b,'zh-Hant'));
  if(!names.length){ list.innerHTML = `<div class="card"><div class="empty">還沒有任何人上傳回報。</div></div>`; return; }
  const html = names.map(name => {
    const wk = everyone[name].weeks?.[day] || {};
    const ips = Object.keys(wk).filter(ip => { const e=wk[ip]; if(filter==='all') return true; if(filter==='stuck') return e.status==='stuck'; if(filter==='wait') return e.status==='wait'; if(filter==='help') return !!e.help; return true; });
    if(filter!=='all' && !ips.length) return '';
    const rows = ips.length ? ips.map(ip => { const e = wk[ip]; const k = name+'|'+ip; const st = STATUS[e.status];
      return `<div class="iprow ${openAll[k]?'open':''}" data-k="${esc(k)}"><div class="t"><span class="sdot ${st?st.cls:''}"></span><span>${esc(ip)}</span>${e.film?`<span class="film">${esc(e.film)}</span>`:''}<span class="st">${st?st.label:'未填狀態'}</span><span class="arrow">${openAll[k]?'▴':'▾'}</span></div><div class="d">${entryDetail(e)}</div></div>`; }).join('')
      : `<div class="empty" style="padding:8px">這天沒填</div>`;
    return `<div class="card person"><h3><span>${esc(name)}</span>${name===cfg.name?'<span class="badge">我</span>':''}<span class="meta">${ips.length?ips.length+' 個 IP':''}</span></h3>${rows}</div>`;
  }).join('');
  list.innerHTML = html || `<div class="card"><div class="empty">這個篩選條件下沒有東西。</div></div>`;
  list.querySelectorAll('.iprow .t').forEach(t => t.onclick = () => { const k=t.parentElement.dataset.k; openAll[k]=!openAll[k]; renderAll(); });
}

/* ================= 日曆 ================= */
function daysWithData(){ const m={}; for(const n of Object.keys(everyone)){ for(const dk of Object.keys(everyone[n].weeks||{})){ if(Object.keys(everyone[n].weeks[dk]).length) (m[dk] ||= new Set()).add(n); } } return m; }
function renderCal(){ calMonth ||= day.slice(0,7); const [y,m]=calMonth.split('-').map(Number); $('#calTitle').textContent=`${y} 年 ${m} 月`;
  const first=new Date(y,m-1,1); const start=new Date(first); start.setDate(1-first.getDay()); const marks=daysWithData(); const today=ymd(new Date());
  let h = WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=ymd(d); const other=d.getMonth()!==m-1; const n=marks[k]?Math.min(marks[k].size,3):0;
    h += `<button class="day ${other?'other':''} ${k===today?'today':''} ${k===day?'sel':''}" data-d="${k}">${d.getDate()}${n?`<span class="m">${'<i></i>'.repeat(n)}</span>`:''}</button>`; }
  $('#calGrid').innerHTML=h; $('#calGrid').querySelectorAll('.day').forEach(b=>b.onclick=()=>{ setDay(b.dataset.d); closeCal(); }); }
function openCal(){ calMonth=day.slice(0,7); renderCal(); $('#cal').classList.add('on'); $('#calBg').classList.add('on'); }
function closeCal(){ $('#cal').classList.remove('on'); $('#calBg').classList.remove('on'); }
function setDay(k){ day=k; openIp=null; renderDay(); renderMine(); renderAll(); }
$('#calPrev').onclick=()=>{ const [y,m]=calMonth.split('-').map(Number); calMonth=ymd(new Date(y,m-2,1)).slice(0,7); renderCal(); };
$('#calNext').onclick=()=>{ const [y,m]=calMonth.split('-').map(Number); calMonth=ymd(new Date(y,m,1)).slice(0,7); renderCal(); };
$('#calToday').onclick=()=>{ setDay(ymd(new Date())); closeCal(); };
$('#calClose').onclick=closeCal; $('#calBg').onclick=closeCal;
$('#dayPick').onclick=openCal;
$('#dayPrev').onclick=()=>setDay(shiftDay(day,-1));
$('#dayNext').onclick=()=>setDay(shiftDay(day,1));

/* ================= ☰ 選單 ================= */
function openDrawer(){ $('#drawer').classList.add('on'); $('#drawerBg').classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#drawerBg').classList.remove('on'); }
$('#btnMenu').onclick=openDrawer; $('#drawerBg').onclick=closeDrawer;
$('#mSwitch').onclick=()=>{ closeDrawer(); showWho(); };
$('#mSheet').href = SHEET_URL;
$('#mCopyAll').onclick=()=>{ closeDrawer(); const w=dayLabel(day); copyText(`📋 IP 週報 ${w.main}\n\n` + Object.keys(everyone).sort().map(n=>personText(n, everyone[n])).join('\n\n')); };
$('#mExport').onclick=()=>{ closeDrawer(); const blob=new Blob([JSON.stringify({cfgName:cfg.name, mine, everyone},null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`IP週報_${cfg.name||'備份'}_${ymd(new Date())}.json`; a.click(); };
$('#mRefresh').onclick=()=>{ closeDrawer(); refreshAll(false); };

/* ================= 事件 ================= */
$$('.tabs button').forEach(b => b.onclick = () => showPage(b.dataset.page));
$('#btnAddIp').onclick = () => { const v = $('#newIpName').value.trim(); if(!v) return toast('先打 IP 名字'); ensureMine(); if(mine.ips.includes(v)) return toast('已經有這個 IP 了'); mine.ips.push(v); $('#newIpName').value=''; openIp=v; persistDraft(); uploadIps(); renderMine(); };
$('#newIpName').addEventListener('keydown', e => { if(e.key==='Enter') $('#btnAddIp').click(); });
$$('.filters button').forEach(b => b.onclick = () => { filter=b.dataset.f; $$('.filters button').forEach(x=>x.classList.toggle('on',x===b)); renderAll(); });
$('#btnCopyMine').onclick = () => copyText(personText(cfg.name||'我', mine));
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('已複製'); }catch(e){ prompt('手動複製：', t); } }
$('#whoGo').onclick = () => becomeUser($('#whoName').value);
$('#whoName').addEventListener('keydown', e => { if(e.key==='Enter') $('#whoGo').click(); });

/* ================= 啟動 ================= */
$('#ver').textContent = APP_VER;
(function readHash(){ const h = new URLSearchParams(location.hash.replace(/^#/,'')); const n=h.get('n'); if(n){ cfg.name=n; saveJSON(LS.cfg, cfg); } })();
renderHeader(); renderDay(); ensureMine(); renderMine(); renderAll();
showPage('mine');
if(!cfg.name) showWho();
refreshAll(true);
setInterval(() => { if(document.visibilityState==='visible') refreshAll(true); }, 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') refreshAll(true); });
</script>
