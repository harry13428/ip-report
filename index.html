<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F4E79">
<title>IP 週報</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4E79'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EIP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F6F9;--card:#FFFFFF;--ink:#1B1F27;--muted:#6B7280;--line:#E3E7EE;
  --accent:#1F4E79;--accent-ink:#FFFFFF;--soft:#E8F0F8;
  --ok:#16A34A;--wait:#D97706;--stuck:#DC2626;--done:#2563EB;--warn-bg:#FEF2F2;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0F141B;--card:#171E28;--ink:#E7EBF0;--muted:#98A2B3;--line:#2A3441;--soft:#1E2B3A;--warn-bg:#3A1D1D;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
textarea{width:100%;min-height:64px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.5}
input[type=text],input[type=date],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);-webkit-appearance:none;appearance:none;min-height:44px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.app{max-width:760px;margin:0 auto;padding:0 12px 96px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 6px}
.topbar{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px;white-space:nowrap;display:flex;align-items:center}
.brand small{font-weight:600;color:var(--accent);font-size:13px;margin-left:8px;background:var(--soft);padding:2px 9px;border-radius:999px}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;min-width:0}
.sync span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:120px}
@media (max-width:420px){ .sync span:last-child{display:none} }
.dot{width:9px;height:9px;border-radius:50%;background:#9CA3AF;display:inline-block}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--wait);animation:pulse 1s infinite}.dot.err{background:var(--stuck)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;flex:none}
.datebar{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--card);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.datebar button{height:38px;border-radius:9px;background:var(--soft);font-weight:700;color:var(--accent)}
.datebar .nav{width:40px;font-size:18px}
.datebar .pick{flex:1;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.datebar .pick small{font-weight:500;color:var(--muted);font-size:12px}
.rangebar{margin-top:8px}
.rangebar .seg button{flex:1;text-align:center}
.rangebar input[type=date]{min-height:38px;padding:6px 10px}
.guide{margin:10px 0 4px;padding:9px 12px;border-radius:10px;background:var(--soft);color:var(--accent);font-size:13px;line-height:1.5}
.guide b{font-weight:800}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;padding:8px 4px;border-radius:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ic{font-size:20px}
.tabs button.on{color:var(--accent);background:var(--soft);font-weight:700}
.page{display:none}.page.on{display:block}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:16px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--soft);color:var(--accent);font-weight:700;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--warn-bg);color:var(--stuck)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{margin:12px 0 0}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.field label small{font-weight:500;color:var(--muted);margin-left:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.status-seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:10px}
.status-seg button.on.ok{background:var(--ok);border-color:var(--ok)}
.status-seg button.on.wait{background:var(--wait);border-color:var(--wait)}
.status-seg button.on.stuck{background:var(--stuck);border-color:var(--stuck)}
.status-seg button.on.done{background:var(--done);border-color:var(--done)}
.ipcard .head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.ipcard .head .name{font-weight:800;font-size:17px;flex:1}
.ipcard .head .state{font-size:12px;color:var(--muted)}
.ipcard .body{display:none;margin-top:6px}
.ipcard.open .body{display:block}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent)}
.badge.dirty{background:#FEF3C7;color:#92400E}
.badge.ok{background:#DCFCE7;color:#166534}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600}
.pill button{color:var(--muted);font-size:14px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.openrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:10px;margin-top:8px}
.openrow .rm{justify-self:end}
.sdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block;background:#9CA3AF}
.sdot.ok{background:var(--ok)}.sdot.wait{background:var(--wait)}.sdot.stuck{background:var(--stuck)}.sdot.done{background:var(--done)}
.person h3{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.person h3 .meta{font-weight:500;color:var(--muted);font-size:12px;margin-left:auto}
.iprow{border-top:1px solid var(--line)}
.iprow:first-of-type{border-top:0}
.iprow .t{display:flex;align-items:center;gap:8px;font-weight:700;padding:11px 0;cursor:pointer;user-select:none}
.iprow .t .film{font-weight:500;color:var(--muted);font-size:13px}
.iprow .t .st{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;white-space:nowrap}
.iprow .t .arrow{color:var(--muted);font-size:12px}
.kv{margin:4px 0 0 20px;font-size:14px;color:var(--ink)}
.kv b{color:var(--muted);font-weight:600;margin-right:4px}
.kv.help{color:var(--stuck)}
.kv.help b{color:var(--stuck)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.filters button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
.check input{margin-top:3px}
.divider{height:1px;background:var(--line);margin:12px 0}
.donelist{border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin:6px 0 4px}
.donerow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.donerow:first-child{border-top:0}
.donerow .f{font-weight:700}
.donerow .s{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.donerow .acts{margin-left:auto;display:flex;gap:4px;flex:none}
.donerow .acts .btn.small{padding:4px 8px;min-height:30px}
.formtitle{scroll-margin-top:190px;font-weight:800;margin-top:12px;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.iprow .ipname{font-weight:800;font-size:15px;padding:10px 0 2px;display:flex;align-items:center;gap:8px}
.iprow .ipname .cnt{font-weight:500;color:var(--muted);font-size:12px}
.vid .t{display:flex;align-items:center;gap:8px;padding:8px 0 8px 6px;cursor:pointer;user-select:none;font-weight:600}
.vid .t .film{font-size:14px}
.det{font-size:12px;color:var(--muted);font-weight:500;background:var(--soft);padding:1px 7px;border-radius:999px;white-space:nowrap}
.donerow .det{margin-left:-2px}
.vid .t .st{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;white-space:nowrap}
.vid .t .arrow{color:var(--muted);font-size:12px}
.vid .d{display:none;padding:0 0 8px}
.vid.open .d{display:block}
.extra{margin-top:14px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.extra summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);list-style:none}
.extra summary::before{content:'▸ ';}
.extra[open] summary::before{content:'▾ ';}
a{color:var(--accent)}
.ver{color:var(--muted);font-size:11px;text-align:center;margin-top:20px}

/* 誰在用（登入畫面） */
.who{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.who .box{max-width:480px;margin:6vh auto 0}
.who h1{font-size:26px;margin:0 0 4px}
.who p{color:var(--muted);margin:0 0 18px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.names button{padding:16px 10px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:18px}
.names button:active{background:var(--soft)}
.who .or{color:var(--muted);font-size:13px;margin:8px 0}
.who .roles{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.who .roles button{padding:13px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:16px;text-align:left}
.who .roles button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.who .grp{color:var(--muted);font-size:13px;font-weight:700;margin:14px 0 8px}
.who .grp:first-child{margin-top:0}

/* ☰ 側邊選單 */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,320px);background:var(--card);z-index:45;transform:translateX(-105%);transition:transform .2s;padding:18px 14px;overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.2)}
.drawer.on{transform:none}.drawer-bg.on{display:block}
.drawer h2{margin:0 0 4px;font-size:18px}
.drawer .me{color:var(--muted);font-size:13px;margin-bottom:14px}
.drawer .item{display:flex;align-items:center;gap:10px;width:100%;padding:13px 10px;border-radius:10px;font-weight:600;text-align:left;text-decoration:none;color:var(--ink)}
.drawer .item:hover{background:var(--soft)}
.drawer .item .ic{width:24px;text-align:center}
.drawer .sec{color:var(--muted);font-size:12px;margin:14px 10px 4px}
.members{display:flex;flex-direction:column;gap:6px;padding:2px 6px 6px}
.member{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:14px;font-weight:700}
.member .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.member .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member small{font-weight:500;color:var(--muted);white-space:nowrap}
.member.me .av{outline:2px solid #fff}
.member .rm{color:var(--stuck);font-size:15px;padding:2px 6px}
.member .rolebtn{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--accent)}

/* 日曆 */
.cal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.cal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);background:var(--card);border-radius:16px;padding:14px;z-index:45;display:none;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.cal.on,.cal-bg.on{display:block}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .mh b{font-size:17px}
.cal .mh button{width:36px;height:36px;border-radius:9px;background:var(--soft);color:var(--accent);font-weight:800;font-size:18px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal .day{position:relative;aspect-ratio:1;border-radius:10px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.cal .day.other{color:var(--line)}
.cal .day.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .day.sel{background:var(--accent);color:#fff}
.cal .day .m{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal .day .m i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.cal .day.sel .m i{background:#fff}
.cal .foot{display:flex;gap:8px;margin-top:10px}

/* ===== 全部人：一支片一張小卡，狀態大標籤，展開後表格式 ===== */
.person h3{font-size:19px;margin-bottom:0;cursor:pointer;user-select:none;padding:2px 0}
.person h3 .caret{color:var(--muted);font-size:14px;margin-left:6px}
.person .pbody{display:none;margin-top:6px}
.person.open .pbody{display:block}
.iprow{border-top:0;margin-top:10px}
.iprow .ipname{font-size:17px;font-weight:800;padding:9px 12px;background:var(--accent);border-radius:8px;color:#fff;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.iprow .ipname .cnt{font-weight:600;color:#fff;opacity:.8;font-size:12px;background:rgba(255,255,255,.18);padding:1px 8px;border-radius:999px}
.iprow .ipname{cursor:pointer;user-select:none}
.iprow .ipname .caret{margin-left:auto;opacity:.8;font-size:13px}
.iprow .ipbody{display:none}
.iprow.open .ipbody{display:block}
.vid{margin:8px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.vid .t{display:flex;align-items:center;gap:10px;padding:12px 12px;cursor:pointer;user-select:none;font-weight:700}
.vid .t .film{font-size:16px;font-weight:800;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid .t .arrow{color:var(--muted);font-size:13px}
.stage{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:800;white-space:nowrap;flex:none}
.stage.in{background:#DBEAFE;color:#1E40AF}
.stage.out{background:#FFEDD5;color:#9A3412}
.stage.done{background:#DCFCE7;color:#166534}
.stage.none{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme: dark){ .stage.in{background:#1E3A8A;color:#BFDBFE} .stage.out{background:#7C2D12;color:#FED7AA} .stage.done{background:#14532D;color:#BBF7D0} }
.vid .sub{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;cursor:pointer;user-select:none}
.vid .sub .det{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.vid .sub .det.warn{background:var(--warn-bg);color:var(--stuck);border-color:transparent}
.vid .d{display:none;border-top:1px solid var(--line);padding:4px 12px 12px;background:var(--card)}
.vid.open .d{display:block}
.grid2{display:grid;grid-template-columns:96px 1fr;gap:0}
.grid2 > div{padding:9px 0;border-bottom:1px solid var(--line)}
.grid2 > div:nth-last-child(-n+2){border-bottom:0}
.grid2 .k{color:var(--muted);font-size:13px;font-weight:600;padding-right:8px}
.grid2 .v{font-size:15px;font-weight:600;color:var(--ink);word-break:break-word}
.grid2 .v.red{color:var(--stuck)}
.helpbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--stuck);font-weight:700;font-size:15px}
.vid .meta{color:var(--muted);font-size:12px;margin-top:8px}

/* 截圖與連結 */
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photos .ph{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:block}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:22px;text-align:center}
.photos .ph.add{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;color:var(--accent);border:2px dashed var(--accent);background:var(--soft);cursor:pointer;line-height:1.3}
.photos.view .ph{width:96px;height:96px}
.links .lk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--bg)}
.links .lk a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.links .lk button{color:var(--muted)}
.lkline{display:block;padding:6px 0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<!-- 誰在用 -->
<div class="who" id="who" style="display:none">
  <div class="box">
    <h1>IP 週報</h1>
    <p>你是誰？點一下自己的名字就進去。</p>
    <div id="nameList"></div>
    <div class="or">名單裡沒有你：先選你是誰，再打名字</div>
    <div class="roles" id="whoRole"><button data-r="主管">👔 主管</button><button class="on" data-r="組員">✂️ 組員</button></div>
    <div class="row"><input type="text" id="whoName" placeholder="打你的名字" style="flex:1;min-width:140px"><button class="btn primary" id="whoGo">進去</button></div>
  </div>
</div>

<!-- ☰ 選單 -->
<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer">
  <h2>IP 週報</h2>
  <div class="me">現在是：<b id="drawerMe"></b></div>
  <div class="sec">主管</div>
  <div class="members" id="membersBoss"></div>
  <div class="sec">成員</div>
  <div class="members" id="members"></div>
  <button class="item" id="mSwitch"><span class="ic">👤</span>換人（回到選名字）</button>
  <div class="sec">主管用</div>

<script>
/* ================= 設定 ================= */
const APP_VER = 'v5.11';
const API_URL = 'https://script.google.com/macros/s/AKfycbycx6jdZdggGz4iVkDJ5ZkjoyT5n-7X2Vt0hbn86iwU1KgaFrb3RvZoS_XWhcDy3aN4/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1rpuVje8QJrwARumPDnT6S7eyKlNMSe6Y14JBXWfY3us/edit';
const API = new URLSearchParams(location.search).get('api') || API_URL;
const LS = { cfg: 'ipreport_cfg_v3', draft: 'ipreport_draft_v4', cache: 'ipreport_cache_v4' };
const REASON_OPTS = ['缺素材', '還在修改', '等主管內審', '等 IP 補資料', '其他'];          // 為什麼還在內審
const REPLY_OPTS  = ['還沒給 IP 看', '已給 IP 看，未回覆', 'IP 已回覆要修改', '已標記小野', 'IP 已過片', '其他'];        // 外審之後的狀態
const WD = ['日','一','二','三','四','五','六'];

/* 狀態：右邊只顯示 內審／外審／已過片；細節（還在修改、IP 要修改…）顯示在片名旁邊 */
function stateOf(e){
  const cls = e.help ? 'stuck' : (e.stage==='已完成' || (e.stage==='外審' && e.ipReply==='IP 已過片')) ? 'done' : (e.stage==='外審' && (e.ipReply==='已給 IP 看，未回覆'||e.ipReply==='IP 已回覆要修改')) ? 'wait' : (e.stage==='內審' && e.reason==='缺素材') ? 'wait' : '';
  let stage = e.stage || '還沒填'; let detail = '';
  if(e.stage==='已完成'){ stage='✅ 已完成'; }
  else if(e.stage==='外審'){
    if(e.ipReply==='IP 已過片'){ stage='✅ 已過片'; }
    else if(e.ipReply==='已給 IP 看，未回覆') detail='等 IP 回覆';
    else if(e.ipReply==='IP 已回覆要修改') detail='IP 要修改';
    else if(e.ipReply==='已標記小野') detail='已標記小野';
    else if(e.ipReply==='還沒給 IP 看') detail='還沒給 IP';
    else if(e.ipReply==='其他') detail=e.replyNote||'其他';
  } else if(e.stage==='內審'){ detail = e.reason==='其他' ? (e.reasonNote||'其他') : (e.reason||''); }
  if(e.help) detail = (detail?detail+'・':'') + '⚠️ 需要主管協助';
  const scls = (e.stage==='已完成' || (e.stage==='外審' && e.ipReply==='IP 已過片')) ? 'done' : e.stage==='內審' ? 'in' : e.stage==='外審' ? 'out' : 'none';
  return { cls, stage, detail, scls, label: stage + (detail?('・'+detail):'') };
}

/* ================= 小工具 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const nowStr = () => { const d=new Date(); return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function loadJSON(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function fmtTime(iso){ const d=new Date(iso); if(isNaN(d)) return ''; return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtD(d){ if(!d) return ''; const k=String(d).slice(0,10); const [y,m,dd]=k.split('-'); if(!m||!dd) return String(d); return `${+m}/${+dd}`; }
function dayKey(d){ return String(d||'').slice(0,10); }
function shiftDay(key, n){ const x=parseYmd(key); x.setDate(x.getDate()+n); return ymd(x); }
function dayLabel(key){ const d=parseYmd(key); const t=ymd(new Date());
  const tag = key===t ? '今天' : key===shiftDay(t,-1) ? '昨天' : key===shiftDay(t,1) ? '明天' : '';
  return { main:`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`, sub: tag }; }
const clone = o => JSON.parse(JSON.stringify(o));

/* ================= 狀態 =================
   everyone[name] = { name, ips:[...], weeks:{ 日期:{ IP:[ 影片, 影片, ... ] } } }
   drafts[日期][IP] = 正在填的那一支（沒上傳）；drafts 裡的 _key 是「正在編輯哪一支已上傳的片」的片名 */
let cfg = loadJSON(LS.cfg, { name:'' });
let day = ymd(new Date());
let myIps = loadJSON(LS.draft, {}).ips || [];
let drafts = loadJSON(LS.draft, {}).drafts || {};
let everyone = loadJSON(LS.cache, {});
let filter = 'all';
let openIp = null; let openAll = {}; let openPerson = {}; let openIpAll = {};
let calMonth = null;
let mode = 'day'; let rangeFrom = ''; let rangeTo = '';

function blankEntry(){ return { film:'', stage:'', reason:'', reasonNote:'', ipReply:'', replyNote:'', pending:'', chased:'', reviewDate:'', publishDate:'', news:'', photos:[], links:[], help:'', updatedAt:'' }; }
function draft(ip){ drafts[day] ||= {}; drafts[day][ip] ||= blankEntry(); return drafts[day][ip]; }
function persist(){ saveJSON(LS.draft, { ips: myIps, drafts }); }
function touch(ip){ draft(ip)._dirty = new Date().toISOString(); }
const mineRemote = () => (cfg.name && everyone[cfg.name]) || null;
function uploaded(ip){ return (mineRemote()?.weeks?.[day]?.[ip]) || []; }   // 這天已上傳的片

/* ================= Google 試算表 API ================= */
async function fetchJSON(url, opt, tries=3){
  let last='';
  for(let i=0;i<tries;i++){
    try{ const r = await fetch(url, opt); const t = await r.text(); if(t.trim().startsWith('{')){ const j = JSON.parse(t); if(!j.ok) throw new Error(j.error||'伺服器錯誤'); return j; } last='Google 暫時沒回應'; }
    catch(e){ if(e.message && !/Google/.test(e.message) && !/JSON|fetch|network/i.test(e.message)) throw e; last=e.message||'連線失敗'; }
    await new Promise(r=>setTimeout(r, 600*(i+1)));
  }
  throw new Error(last);
}
async function apiGet(params){ const u = API + '?' + new URLSearchParams({ ...params, _: Date.now() }); return fetchJSON(u, { method:'GET', redirect:'follow', cache:'no-store' }); }
async function apiPost(body){ return fetchJSON(API, { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); }
function setSync(state, text){ const d=$('#syncDot'); d.className='dot '+(state||''); $('#syncText').textContent=text; }

/* 後端舊格式（一個 IP 一支）也吃得下 */
function normalize(editors){ for(const n of Object.keys(editors||{})){ const w = editors[n].weeks||{}; for(const dk of Object.keys(w)){ for(const ip of Object.keys(w[dk])){ if(!Array.isArray(w[dk][ip])) w[dk][ip] = [w[dk][ip]]; } } } return editors||{}; }

async function refreshAll(silent){
  setSync('busy', '下載中…');
  try{
    const j = await apiGet({ action:'all' });
    everyone = normalize(j.editors); saveJSON(LS.cache, everyone);
    if(cfg.name && everyone[cfg.name]){ myIps = [...new Set([...(everyone[cfg.name].ips||[]), ...myIps])]; persist(); }
    setSync('ok', '已同步 ' + nowStr());
    if(!silent) toast('已更新大家的回報');
  }catch(e){ setSync('err', '同步失敗'); if(!silent) toast('下載失敗：' + e.message); }
  renderAll(); renderWho(); renderMembers();
  if(!isTyping()) renderMine();   // 正在打字或選日期時不要重畫，不然輸入會被打斷
}
function isTyping(){ const a = document.activeElement; return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#page-mine').contains(a)); }

/* 上傳草稿：成功後草稿清空（保留 IP），這支片進到「已上傳」清單 */
async function uploadDraft(ip){
  if(!cfg.name){ showWho(); return; }
  const e = draft(ip); const owner = e._owner || cfg.name;
  if(!e.film.trim()) { toast('先填這支影片的名字'); return; }
  if(!e.stage) { toast('先選內審或外審'); return; }
  setSync('busy', '上傳中…');
  try{
    const send = clone(e); delete send._dirty; delete send._key; delete send._owner; send.updatedAt = new Date().toISOString();
    const j = await apiPost({ action:'save', editor:owner, week:day, ip, keyFilm: (e._key ?? e.film), entry:send, ...(owner===cfg.name?{ips:myIps}:{}) });
    send.updatedAt = j.updatedAt || send.updatedAt;
    everyone[owner] ||= { name:owner, ips:[], weeks:{} }; const R = everyone[owner]; if(owner===cfg.name) R.ips=[...myIps]; R.weeks ||= {}; R.weeks[day] ||= {}; const list = (R.weeks[day][ip] ||= []);
    const idx = list.findIndex(x => x.film === (e._key ?? e.film)); if(idx>=0) list[idx] = send; else list.push(send);
    saveJSON(LS.cache, everyone);
    drafts[day][ip] = blankEntry(); persist();
    setSync('ok', '已上傳 ' + nowStr()); toast(idx>=0 ? '已更新這支片' : '已上傳，可以寫下一支');
  }catch(err){ setSync('err', '上傳失敗'); toast('上傳失敗：' + err.message); }
  renderMine(); renderAll();
}
async function uploadIps(role){ if(!cfg.name) return; try{ await apiPost({ action:'ips', editor:cfg.name, ips:myIps, ...(role?{role}:{}) }); everyone[cfg.name] ||= { name:cfg.name, ips:[], weeks:{} }; everyone[cfg.name].ips=[...myIps]; }catch(e){ toast('IP 清單沒同步成功：'+e.message); } }

/* 截圖：先縮到最長邊 1280、JPEG，再送後端存雲端硬碟 */
function linkLabel(u){ try{ const h = new URL(u).hostname.replace(/^www\./,''); if(/instagram/.test(h)) return '📸 Instagram：' + u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60); if(/youtu/.test(h)) return '▶️ YouTube：' + u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60); if(/tiktok|douyin/.test(h)) return '🎵 ' + u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60); return '🔗 ' + u.replace(/^https?:\/\/(www\.)?/,'').slice(0,60); }catch(e){ return u; } }
function shrink(file){ return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = () => { const max = 1024; let w = img.naturalWidth, h = img.naturalHeight; const r = Math.min(1, max/Math.max(w,h)); w = Math.round(w*r); h = Math.round(h*r);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
    res(c.toDataURL('image/jpeg', 0.75).split(',')[1]); };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('這個檔案不是圖片')); }; img.src = url; }); }
async function uploadPhotos(ip, files){
  if(!files.length) return; if(!API){ toast('還沒接上試算表'); return; }
  setSync('busy', `上傳截圖 0/${files.length}…`); let n = 0, fail = 0;
  await Promise.all(files.map(async f => {
    try{ const data = await shrink(f); const j = await apiPost({ action:'upload', data, mime:'image/jpeg', name:`${cfg.name}_${ip}_${Date.now()}_${Math.random().toString(36).slice(2,6)}.jpg` }); (draft(ip).photos ||= []).push(j.url); touch(ip); persist(); n++; setSync('busy', `上傳截圖 ${n}/${files.length}…`); renderMine(); }
    catch(e){ fail++; }
  }));
  setSync('ok', '已同步 ' + nowStr()); if(n) toast(`已上傳 ${n} 張截圖，記得按儲存`); if(fail) toast(`${fail} 張沒上傳成功，再試一次`);
}

/* 把已上傳的某支片載入表單編輯（可以是別人的：_owner 記誰的） */
function editEntry(owner, dk, ip, film){
  const list = (everyone[owner]?.weeks?.[dk]?.[ip]) || []; const src = list.find(x=>x.film===film); if(!src) return toast('找不到這支片');
  day = dk; if(mode!=='day') setMode('day'); renderDay();
  if(owner===cfg.name && !myIps.includes(ip)) myIps.push(ip);
  drafts[day] ||= {}; drafts[day][ip] = Object.assign(clone(src), { _key: film, _owner: owner, _dirty: new Date().toISOString() }); persist();
  if(owner!==cfg.name && !myIps.includes(ip)) myIps.push(ip);   // 別人的 IP 也暫時列出來給你改
  openIp = ip; showPage('mine'); renderMine();
  setTimeout(() => { const el = document.querySelector('.ipcard.open .formtitle'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 60);
  toast(owner===cfg.name ? `正在編輯「${ip}｜${film}」` : `正在幫 ${owner} 編輯「${ip}｜${film}」`);
}

/* 選一個 IP（移動用）：列出那個人現有的 IP，也可以打新的 */
function pickIp(owner, current){ return new Promise(res => {
  const ips = [...new Set([...(everyone[owner]?.ips||[]), ...(owner===cfg.name?myIps:[])])].filter(x=>x!==current);
  const bg = document.createElement('div'); bg.className='cal-bg on'; const box = document.createElement('div'); box.className='cal on';
  box.innerHTML = `<div class="mh"><b>移到哪個 IP？</b></div><div class="names" style="margin-bottom:10px">${ips.map(x=>`<button data-ip="${esc(x)}">${esc(x)}</button>`).join('')||'<div class="empty" style="grid-column:1/-1">沒有其他 IP，在下面打新的</div>'}</div><div class="row"><input type="text" placeholder="或打新的 IP 名字" style="flex:1"><button class="btn primary" data-go="1">移過去</button></div><div class="foot"><button class="btn" data-cancel="1" style="flex:1">取消</button></div>`;
  const done = v => { bg.remove(); box.remove(); res(v); };
  box.querySelectorAll('[data-ip]').forEach(b => b.onclick = () => done(b.dataset.ip));
  box.querySelector('[data-go]').onclick = () => { const v = box.querySelector('input').value.trim(); if(!v) return toast('先打 IP 名字'); done(v); };
  box.querySelector('[data-cancel]').onclick = () => done(null); bg.onclick = () => done(null);
  document.body.append(bg, box); box.querySelector('input').focus();
}); }

/* 整筆移到別的 IP */
async function moveEntryUI(owner, dk, ip, film){
  const newIp = await pickIp(owner, ip); if(!newIp || newIp===ip) return;
  setSync('busy', '移動中…');
  try{ await apiPost({ action:'move', week:dk, editor:owner, ip, film, newIp });
    const W = everyone[owner].weeks[dk]; const idx = W[ip].findIndex(x=>x.film===film); const [e] = W[ip].splice(idx,1); if(!W[ip].length) delete W[ip]; (W[newIp] ||= []).push(e);
    everyone[owner].ips = [...new Set([...(everyone[owner].ips||[]), newIp])]; if(owner===cfg.name && !myIps.includes(newIp)) myIps.push(newIp);
    saveJSON(LS.cache, everyone); persist(); setSync('ok', '已同步 ' + nowStr()); toast(`已把「${film}」移到 ${newIp}`);
  }catch(e){ setSync('err', '移動失敗'); toast('移動失敗：' + e.message); }
  renderMine(); renderAll();
}
/* 刪一支片 */
async function deleteEntryUI(owner, dk, ip, film){
  if(!confirm(`刪掉 ${owner} 的「${ip}｜${film||'（沒寫片名）'}」？刪了就找不回來。`)) return;
  setSync('busy', '刪除中…');
  try{ await apiPost({ action:'delete', week:dk, editor:owner, ip, film });
    const W = everyone[owner]?.weeks?.[dk]; if(W && W[ip]){ W[ip] = W[ip].filter(x=>x.film!==film); if(!W[ip].length) delete W[ip]; }
    saveJSON(LS.cache, everyone); setSync('ok', '已同步 ' + nowStr()); toast('已刪除');
  }catch(e){ setSync('err', '刪除失敗'); toast('刪除失敗：' + e.message); }
  renderMine(); renderAll();
}
/* 刪掉自己的一個 IP（打錯名字用） */
async function removeIpUI(ip){
  const W = everyone[cfg.name]?.weeks || {}; let n = 0; for(const dk of Object.keys(W)) n += (W[dk][ip]||[]).length;
  if(!confirm(n ? `刪掉 IP「${ip}」？它底下有 ${n} 支已上傳的片，會一起刪掉。` : `刪掉 IP「${ip}」？`)) return;
  myIps = myIps.filter(x=>x!==ip); if(drafts[day]) delete drafts[day][ip]; persist(); renderMine();
  try{ await apiPost({ action:'deleteIp', editor:cfg.name, ip, withRows:true });
    if(everyone[cfg.name]){ everyone[cfg.name].ips = myIps.slice(); for(const dk of Object.keys(W)) delete W[dk][ip]; saveJSON(LS.cache, everyone); }
    toast(n ? `已刪掉 ${ip} 和 ${n} 支片` : `已刪掉 ${ip}`);
  }catch(e){ toast('刪除沒成功：' + e.message); }
  renderMine(); renderAll();
}

/* ================= 誰在用 ================= */
function showWho(){ $('#who').style.display=''; renderWho(); }
function hideWho(){ $('#who').style.display='none'; }
function renderWho(){ const names = Object.keys(everyone).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const grp = r => names.filter(n => (everyone[n].role||'組員')===r);
  const block = (title, list) => list.length ? `<div class="grp">${title}</div><div class="names">${list.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : '';

/* ================= 日期範圍 ================= */
function mondayOf(key){ const d=parseYmd(key); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ymd(d); }
function curRange(){ if(mode==='week'){ const m=mondayOf(day); return [m, shiftDay(m,6)]; } if(mode==='range'){ const a=rangeFrom||day, b=rangeTo||day; return a<=b?[a,b]:[b,a]; } return [day, day]; }
function datesIn(){ const [a,b]=curRange(); const out=[]; let k=a; let guard=0; while(k<=b && guard++<400){ out.push(k); k=shiftDay(k,1); } return out; }
function rangeLabel(){ const [a,b]=curRange(); if(a===b) return dayLabel(a).main; return `${fmtD(a)} – ${fmtD(b)}`; }
function setMode(m){ if(m==='week') day = ymd(new Date());   // 按「本週」一律跳回當週
  mode=m; $$('#modeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.m===m)); $('#rangeInputs').style.display = m==='range' ? '' : 'none';
  if(m==='range'){ if(!rangeFrom){ rangeFrom = mondayOf(day); rangeTo = day; } $('#rangeFrom').value=rangeFrom; $('#rangeTo').value=rangeTo; }
  renderDay(); renderAll(); }
$$('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('#rangeFrom').onchange = () => { rangeFrom = $('#rangeFrom').value; renderDay(); renderAll(); };
$('#rangeTo').onchange = () => { rangeTo = $('#rangeTo').value; renderDay(); renderAll(); };

                            all:'<b>這頁：</b>上面可切「本週」或「自訂範圍」看整段期間。點人名 → 點 IP → 看每支片；點影片那格看細節，可編輯、移到別的 IP、刪除。' }[p]; window.scrollTo(0,0); }

/* ================= 畫面：全部人 ================= */
function entryText(e){
  const st0=stateOf(e); const L=[]; L.push(`　・${e.film||'（沒寫片名）'}　${st0.stage}${st0.detail?('（'+st0.detail+'）'):''}`);
  if(e.stage==='內審' && (e.reason||e.reasonNote)) L.push(`　　還在內審因為：${e.reason==='其他'?(e.reasonNote||'其他'):e.reason}`);
  if(e.stage==='外審'){
    if(e.ipReply) L.push(`　　外審之後：${e.ipReply==='其他'?(e.replyNote||'其他'):e.ipReply}`);
    if(e.pending) L.push(`　　卡在哪：${e.pending}`);
    if(e.chased) L.push(`　　催過片：${e.chased}`);
    if(e.reviewDate) L.push(`　　外審日 ${fmtD(e.reviewDate)}`);
  }
  if(e.publishDate) L.push(`　　預計上片 ${fmtD(e.publishDate)}`);
  if(e.news) L.push(`　　IP 新動態：${e.news}`);
  (e.photos||[]).forEach(u=>L.push(`　　截圖：${u}`));
  (e.links||[]).forEach(u=>L.push(`　　喜歡的風格：${u}`));
  if(e.help) L.push(`　　⚠️ 需要主管協助：${e.help}`);
  return L.join('\n');
}
/* 一個 IP 只出現一次，底下列它的片 */
/* 某個人在目前日期範圍內的片：[{dk, ip, e}] */
function entriesOf(file){ const out=[]; for(const dk of datesIn()){ const wk=file?.weeks?.[dk]||{}; for(const ip of Object.keys(wk)) for(const e of wk[ip]) out.push({dk, ip, e}); } return out; }
/* 一個 IP 只出現一次，底下列它的片（跨日時標日期） */
function personText(name, file){ const items=entriesOf(file); const multi = datesIn().length>1;
  if(!items.length) return `【${name}】${multi?'這段期間':'這天'}沒填`;
  const byIp={}; items.forEach(x=>(byIp[x.ip] ||= []).push(x));
  return `【${name}】\n` + Object.keys(byIp).map(ip=>`■ ${ip}\n` + byIp[ip].map(x=>entryText(x.e).replace(/^　・/, multi?`　・${fmtD(x.dk)}｜`:'　・')).join('\n')).join('\n'); }
function entryDetail(e){
  const rows = [];
  const row = (k, v, red) => rows.push(`<div class="k">${k}</div><div class="v ${red?'red':''}">${v}</div>`);
  if(e.stage==='內審') row('還在內審因為', esc(e.reason==='其他'?(e.reasonNote||'其他'):(e.reason||'沒選')));
  if(e.stage==='外審'){
    row('外審之後', esc(e.ipReply==='其他'?(e.replyNote||'其他'):(e.ipReply||'沒選')));
    if(e.pending) row('卡在哪', esc(e.pending));
    row('催過片', e.chased ? esc(e.chased) : '<span style="color:var(--muted)">沒填</span>', e.chased==='還沒');
    if(e.reviewDate) row('外審日', esc(fmtD(e.reviewDate)));
  }
  if(e.publishDate) row('預計上片', esc(fmtD(e.publishDate)));
  if(e.news) row('IP 新動態', esc(e.news));
  if((e.photos||[]).length) row('IP 截圖', `<div class="photos view">${e.photos.map(u=>`<a class="ph" href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="截圖"></a>`).join('')}</div>`);
  if((e.links||[]).length) row('喜歡的風格', e.links.map(u=>`<a class="lkline" href="${esc(u)}" target="_blank" rel="noopener">${esc(linkLabel(u))}</a>`).join(''));
  let h = rows.length ? `<div class="grid2">${rows.join('')}</div>` : '<div class="meta">沒有其他內容</div>';
  if(e.help) h += `<div class="helpbox">⚠️ 需要主管協助：${esc(e.help)}</div>`;
  if(e.updatedAt) h += `<div class="meta">最後更新 ${fmtTime(e.updatedAt)}</div>`;
  return h; }
function passFilter(e){ if(filter==='all') return true; if(filter==='help') return !!e.help; if(filter==='wait') return e.ipReply==='已給 IP 看，未回覆'; if(filter==='in') return e.stage==='內審'; if(filter==='out') return e.stage==='外審'; if(filter==='done') return e.stage==='已完成' || e.ipReply==='IP 已過片'; return true; }

      return `<div class="iprow ${io?'open':''}" data-ik="${esc(ik)}"><div class="ipname">${esc(ip)}<span class="cnt">${vids.length} 支</span><span class="caret">${io?'▴':'▾'}</span></div><div class="ipbody">` + vids.map(({dk,e}) => { const k = name+'|'+dk+'|'+ip+'|'+e.film; const st = stateOf(e);

        if(e.stage==='外審' && e.chased) chips.push(`<span class="det">催過片：${esc(e.chased)}</span>`);
        if(e.publishDate) chips.push(`<span class="det">預計上片 ${esc(fmtD(e.publishDate))}</span>`);
        return `<div class="vid ${openAll[k]?'open':''}" data-k="${esc(k)}"><div class="t"><span class="stage ${st.scls}">${st.stage}</span><span class="film">${esc(e.film||'（沒寫片名）')}</span><span class="arrow">${openAll[k]?'▴':'▾'}</span></div>${chips.length?`<div class="sub">${chips.join('')}</div>`:''}<div class="d">${entryDetail(e)}<div class="row" style="margin-top:10px"><button class="btn small" data-act="edit" data-o="${esc(name)}" data-dk="${esc(dk)}" data-ip="${esc(ip)}" data-film="${esc(e.film)}">✏️ 編輯</button><button class="btn small" data-act="move" data-o="${esc(name)}" data-dk="${esc(dk)}" data-ip="${esc(ip)}" data-film="${esc(e.film)}">↔ 移到別的 IP</button><button class="btn small danger" data-act="del" data-o="${esc(name)}" data-dk="${esc(dk)}" data-ip="${esc(ip)}" data-film="${esc(e.film)}">🗑 刪除</button></div></div></div>`; }).join('') + `</div></div>`; }).join('')
      : `<div class="empty" style="padding:8px">${multi?'這段期間沒填':'這天沒填'}</div>`;
    const po = openPerson[name] !== undefined ? openPerson[name] : (name===cfg.name);
    return `<div class="card person ${po?'open':''}" data-p="${esc(name)}"><h3><span>${esc(name)}</span>${name===cfg.name?'<span class="badge">我</span>':''}<span class="meta">${n?n+' 支':(multi?'這段期間沒填':'這天沒填')}</span><span class="caret">${po?'▴':'▾'}</span></h3><div class="pbody">${rows}</div></div>`;
  }).join('');
  list.innerHTML = html || `<div class="card"><div class="empty">這個篩選條件下沒有東西。</div></div>`;
  list.querySelectorAll('.iprow .ipname').forEach(h => h.onclick = () => { const k=h.parentElement.dataset.ik; openIpAll[k]=!openIpAll[k]; renderAll(); });
  list.querySelectorAll('.person h3').forEach(h => h.onclick = () => { const n=h.parentElement.dataset.p; const cur = openPerson[n] !== undefined ? openPerson[n] : (n===cfg.name); openPerson[n] = !cur; renderAll(); });
  list.querySelectorAll('.vid .t, .vid .sub').forEach(t => t.onclick = () => { const k=t.parentElement.dataset.k; openAll[k]=!openAll[k]; renderAll(); });   // 點標題列或標籤列都能展開／收合
  list.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { const {act,o,dk,ip,film} = b.dataset; if(act==='edit') editEntry(o, dk, ip, film); else if(act==='move') moveEntryUI(o, dk, ip, film); else deleteEntryUI(o, dk, ip, film); });
}

/* ================= 日曆 ================= */
function daysWithData(){ const m={}; for(const n of Object.keys(everyone)){ for(const dk of Object.keys(everyone[n].weeks||{})){ if(Object.values(everyone[n].weeks[dk]).some(a=>a.length)) (m[dk] ||= new Set()).add(n); } } return m; }
function renderCal(){ calMonth ||= day.slice(0,7); const [y,m]=calMonth.split('-').map(Number); $('#calTitle').textContent=`${y} 年 ${m} 月`;
  const first=new Date(y,m-1,1); const start=new Date(first); start.setDate(1-first.getDay()); const marks=daysWithData(); const today=ymd(new Date());
  let h = WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=ymd(d); const other=d.getMonth()!==m-1; const n=marks[k]?Math.min(marks[k].size,3):0;
    h += `<button class="day ${other?'other':''} ${k===today?'today':''} ${k===day?'sel':''}" data-d="${k}">${d.getDate()}${n?`<span class="m">${'<i></i>'.repeat(n)}</span>`:''}</button>`; }
  $('#calGrid').innerHTML=h; $('#calGrid').querySelectorAll('.day').forEach(b=>b.onclick=()=>{ setDay(b.dataset.d); closeCal(); }); }
function openCal(){ calMonth=day.slice(0,7); renderCal(); $('#cal').classList.add('on'); $('#calBg').classList.add('on'); }
function closeCal(){ $('#cal').classList.remove('on'); $('#calBg').classList.remove('on'); }
function setDay(k){ day=k; if(mode==='range'){ rangeFrom=mondayOf(k); rangeTo=k; $('#rangeFrom').value=rangeFrom; $('#rangeTo').value=rangeTo; } renderDay(); renderMine(); renderAll(); }
$('#calPrev').onclick=()=>{ const [y,m]=calMonth.split('-').map(Number); calMonth=ymd(new Date(y,m-2,1)).slice(0,7); renderCal(); };
$('#calNext').onclick=()=>{ const [y,m]=calMonth.split('-').map(Number); calMonth=ymd(new Date(y,m,1)).slice(0,7); renderCal(); };
$('#calToday').onclick=()=>{ setDay(ymd(new Date())); closeCal(); };
$('#calClose').onclick=closeCal; $('#calBg').onclick=closeCal;
$('#dayPick').onclick=openCal;
$('#dayPrev').onclick=()=>setDay(shiftDay(day, mode==='week'?-7:-1));
$('#dayNext').onclick=()=>setDay(shiftDay(day, mode==='week'?7:1));

/* ================= ☰ 選單 ================= */
function openDrawer(){ $('#drawer').classList.add('on'); $('#drawerBg').classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#drawerBg').classList.remove('on'); }
$('#btnMenu').onclick=openDrawer; $('#drawerBg').onclick=closeDrawer;
/* 手勢：從螢幕左邊緣往右滑＝打開選單；選單開著往左滑＝關閉 */
(function(){ let sx=0, sy=0, edge=false, drawerOpen=false;
  document.addEventListener('touchstart', e => { const t=e.touches[0]; sx=t.clientX; sy=t.clientY; edge = sx < 28; drawerOpen = $('#drawer').classList.contains('on'); }, {passive:true});
  document.addEventListener('touchend', e => { const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy; if(Math.abs(dy) > Math.abs(dx)) return;
    if(edge && dx > 50 && !drawerOpen) openDrawer(); else if(drawerOpen && dx < -50) closeDrawer(); }, {passive:true});
})();
$('#mSwitch').onclick=()=>{ closeDrawer(); showWho(); };
$('#mSheet').href = SHEET_URL;
$('#mCopyAll').onclick=()=>{ closeDrawer(); copyText(`📋 IP 週報 ${rangeLabel()}\n\n` + Object.keys(everyone).sort().map(n=>personText(n, everyone[n])).join('\n\n')); };
$('#mExport').onclick=()=>{ closeDrawer(); const blob=new Blob([JSON.stringify({cfgName:cfg.name, myIps, drafts, everyone},null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`IP週報_${cfg.name||'備份'}_${ymd(new Date())}.json`; a.click(); };
$('#mRefresh').onclick=()=>{ closeDrawer(); refreshAll(false); };

/* ================= 事件 ================= */
$$('.tabs button').forEach(b => b.onclick = () => showPage(b.dataset.page));
$('#btnAddIp').onclick = () => { const v = $('#newIpName').value.trim(); if(!v) return toast('先打 IP 名字'); if(myIps.includes(v)) return toast('已經有這個 IP 了'); myIps.push(v); $('#newIpName').value=''; openIp=v; persist(); uploadIps(); renderMine(); };
$('#newIpName').addEventListener('keydown', e => { if(e.key==='Enter') $('#btnAddIp').click(); });
$$('.filters button').forEach(b => b.onclick = () => { filter=b.dataset.f; $$('.filters button').forEach(x=>x.classList.toggle('on',x===b)); renderAll(); });
$('#mCopyMine').onclick = () => { closeDrawer(); copyText(personText(cfg.name||'我', mineRemote())); };
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('已複製'); }catch(e){ prompt('手動複製：', t); } }
$('#whoGo').onclick = () => becomeUser($('#whoName').value, whoRole);
$('#whoName').addEventListener('keydown', e => { if(e.key==='Enter') $('#whoGo').click(); });

/* ================= 重新整理／新版本偵測 ================= */
function hardReload(){ const u = location.pathname + '?r=' + Date.now() + location.hash; location.replace(u); }
$('#btnReload').onclick = () => { toast('重新整理中…'); setTimeout(hardReload, 150); };
$('#mReload').onclick = () => { closeDrawer(); toast('更新中…'); setTimeout(hardReload, 150); };
async function checkVersion(){ try{ const r = await fetch(location.pathname + '?chk=' + Date.now(), { cache:'no-store' }); const t = await r.text(); const m = t.match(/APP_VER = '([^']+)'/); if(m && m[1] !== APP_VER){ const b=$('#newVer'); b.innerHTML = `<b>有新版本 ${esc(m[1])}</b>（你現在是 ${APP_VER}）— 點這裡更新`; b.style.display=''; b.onclick = hardReload; } }catch(e){} }
setTimeout(checkVersion, 2500); setInterval(checkVersion, 5*60*1000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') checkVersion(); });

/* ================= 啟動 ================= */
$('#ver').textContent = APP_VER;
(function readHash(){ const h = new URLSearchParams(location.hash.replace(/^#/,'')); const n=h.get('n'); if(n){ cfg.name=n; saveJSON(LS.cfg, cfg); } })();
everyone = normalize(everyone);
renderHeader(); renderDay(); renderMine(); renderAll();
showPage('mine');
if(!cfg.name) showWho();
refreshAll(true);
setInterval(() => { if(document.visibilityState==='visible') refreshAll(true); }, 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') refreshAll(true); });
</script>
</body>
